name: CI

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libopus-dev libdav1d-dev libxdo-dev libgl1-mesa-dev
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libopus-dev libdav1d-dev libxdo-dev libgl1-mesa-dev
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Run Workspace Tests
        run: cargo test --workspace

  audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit and deny tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Run Cargo Audit
        run: cargo audit --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2026-0097 --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2026-0258
      - name: Run Cargo Deny
        run: cargo deny check || true

  fuzz-smoke:
    name: Fuzz Smoke Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install Clang & cargo-fuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> fuzz/target"
      - name: Run Frame Decoders Smoke Fuzz
        run: |
          cargo +nightly fuzz run decode_frame -- -max_total_time=20
          cargo +nightly fuzz run decode_blob_frame -- -max_total_time=20

  build-matrix:
    name: Release Build (${{ matrix.os }})
    needs: [fmt, clippy, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libopus-dev libdav1d-dev libxdo-dev libgl1-mesa-dev
      - name: Install macOS build dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install pkg-config opus dav1d
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build Workspace Release
        run: cargo build --workspace --target ${{ matrix.target }} --release
