name: Nix Flake CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-check-and-build:
    name: Nix Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check Nix Flake evaluation & checks
        run: nix flake check --print-build-logs

      - name: Build SIAR CLI
        run: nix build .#siar-cli --print-build-logs

      - name: Build SIAR Emergency Node
        run: nix build .#siar-emergency-node --print-build-logs

      - name: Build SIAR Desktop (Linux)
        run: nix build .#siar-desktop --print-build-logs
