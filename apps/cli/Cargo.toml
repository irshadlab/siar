[package]
name = "siar-cli"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version = "1.91"
description = "Thin command-line client for siar-daemon (all state lives in the daemon)"

[[bin]]
name = "siar"
path = "src/main.rs"

[dependencies]
siar-runtime.workspace = true
tokio = { workspace = true, features = ["process", "time", "macros", "rt", "signal"] }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
