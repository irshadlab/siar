[package]
name = "siar-root"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version = "1.91"
description = "Root-key ceremony for Siar: FROST (RFC 9591) threshold key generation and signing over small hex files. Produces ordinary Ed25519 keys and signatures."

[[bin]]
name = "siar-root"
path = "src/main.rs"

[dependencies]
siar-crypto-advanced = { path = "../../crates/siar-crypto-advanced" }
siar-runtime.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
ed25519-dalek.workspace = true
postcard.workspace = true
