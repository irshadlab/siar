[package]
name = "siar-secure-session"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version = "1.91"
description = "Part 28 §50-§51, §75-§78, §103: the stateful half of the ratchet — encrypted-at-rest session state, stale-restore protection, signed-prekey rotation, and a SecureSessions facade that enforces persist-before-send and commit-before-save"

[dependencies]
siar-crypto.workspace = true
siar-ratchet.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
zeroize.workspace = true
serde.workspace = true
postcard.workspace = true
thiserror.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
