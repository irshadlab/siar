[package]
name = "siar-messaging"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.91"   # inherits siar-transport's iroh floor

[dependencies]
siar-domain.workspace = true
siar-protocol.workspace = true
siar-crypto.workspace = true
siar-crypto-mls.workspace = true
siar-storage.workspace = true
siar-transport.workspace = true
# spec 05 §204 — `send_imported_attachment` / `FilesBlobStore`.
siar-files.workspace = true
# `files_transport` names the store traits the file service is generic over.
siar-blob-manifest.workspace = true
# §33 "Messaging Events" (`events.rs`) — Phase 3 of
# `04-offline-event-log-architecture.md`'s own implementation-phase
# breakdown, same crate `siar-identity-multidevice::audit_log` already
# depends on for §35's identity events.
siar-event-log.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
postcard.workspace = true
serde.workspace = true
async-trait.workspace = true
# Backing `stoolap_projections::StoolapConversationSummaryProjection` —
# same crate, same feature set, `siar-event-log`'s own
# `stoolap_store`/`stoolap_checkpoint_store` already use.
stoolap = { version = "0.4", default-features = false, features = ["parallel"] }
uuid.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
iroh.workspace = true
# Added for send_text_anon's TokenMailboxEnvelope::payload_hash — the
# same already-adopted BLAKE3 primitive siar-crypto's own Session key
# derivation and siar-crypto's mailbox_token module both already use,
# not a new dependency chosen for this one purpose. `siar-protocol`'s
# own `MeshEnvelope`/`TokenMailboxEnvelope` doc comments are explicit
# that hashing the ciphertext is a caller responsibility, not something
# those wire types compute themselves — this crate, as the one actually
# constructing a `TokenMailboxEnvelope`, is that caller.
blake3.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
# spec 05 §204 integration test builds a real FilesService.
siar-file-transfer-service.workspace = true
