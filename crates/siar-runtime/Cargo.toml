[package]
name = "siar-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Daemon & headless runtime (sys-arch Part 16): lifecycle, supervisor, health, idempotent commands, bounded events, local IPC"

[dependencies]
siar-power = { path = "../siar-power" }
# Part 08 facade: limits, overload mode and snapshots hosted by the runtime (§187-188).
siar-resource-limits = { path = "../siar-resource-limits" }
serde.workspace = true
postcard.workspace = true
toml = "1"
# Shutdown plumbing only (CancellationToken, TaskTracker); restart/backoff/breaker policy stays ours.
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Install/uninstall as an OS user service (systemd/launchd/...); our hardened unit text is passed as `contents`.
service-manager = "0.11"
# Cross-platform local IPC (Unix socket / Windows named pipe) + peer credentials.
interprocess = { version = "2.4", features = ["tokio"] }
ed25519-dalek.workspace = true
blake3.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { version = "1.54", features = ["rt", "macros", "sync", "time", "net", "io-util", "signal"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }

[target.'cfg(unix)'.dependencies]
sd-notify = "0.5"
# Effective uid for the no-`XDG_RUNTIME_DIR` socket fallback (macOS, minimal
# containers). `rustix` is the safe wrapper (`geteuid` is not `unsafe` here),
# which keeps this crate's `#![forbid(unsafe_code)]` intact — raw `libc` would not.
rustix = { version = "1", default-features = false, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# U16CStr for the pipe DACL's SDDL string (interprocess's own signature).
widestring = "1"
